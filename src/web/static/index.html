<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Lord of the Links</title><link rel="stylesheet" href="style.css"></head><body class="camera-open"><header><a class="brand" href="/">◉ <strong>THE LORD</strong> OF THE LINKS</a><nav><button data-layer="where" class="active"><b>WHERE?</b><span>Люди и траектории</span></button><button data-layer="why"><b>WHY?</b><span>Плотность</span></button><button data-layer="how"><b>HOW?</b><span>Общие фрагменты</span></button></nav><div class="header-actions"><button id="tracksToggle" aria-controls="tracksDrawer" aria-expanded="false">Треки <span id="total"></span></button><button id="analysisToggle" hidden aria-expanded="false">Фрагменты</button><button id="presenceToggle" aria-controls="presence" aria-expanded="false">Присутствие</button></div></header><aside id="tracksDrawer"><div class="drawer-head"><b>Треки</b><button id="tracksClose" aria-label="Закрыть треки">×</button></div><input id="search" placeholder="Найти ID" aria-label="Найти ID"><label class="check"><input id="visibleOnly" type="checkbox"> Видимые сейчас</label><div id="trackList"></div></aside><main><div class="heading"><div><h1 id="title">Люди в пространстве</h1></div><div class="global-controls"><div id="controls"></div><div class="view-toggle"><button id="topView" class="active">Сверху</button><button id="isoView">3/4</button></div></div></div><b id="mapTitle" hidden></b><div id="mapStage"><svg id="map" viewBox="53 35 572 620" aria-label="Карта офиса и треки"></svg><div id="tip" hidden></div><div class="zoom"><button id="zoomIn" aria-label="Приблизить">+</button><button id="zoomOut" aria-label="Отдалить">−</button></div></div><div class="map-bottom"><span id="mapStatus"></span><span id="datasetDate"></span></div><button id="cameraDrawerToggle" class="edge-tab" aria-label="Показать или скрыть камеры" aria-expanded="true"><span>Камеры</span><b>›</b></button><section class="panel camera-panel"><div class="panel-head"><b id="cameraTitle">Камеры</b>
<div class="camera-controls">
  <button id="allCameras" hidden>Показать все камеры</button>
  <select id="cameraLayout" aria-label="Режим просмотра камер">
    <option value="compact">Компактно</option>
    <option value="wide">Широкая панель</option>
    <option value="full">Только камеры</option>
  </select>
</div></div><div id="cameraTabs"></div><div id="videos"></div></section><section id="analysis" class="panel" hidden></section><section id="presence" class="panel presence" hidden><div class="panel-head"><b>Присутствие на камерах</b><div class="row"><select id="trackSelect" aria-label="Выбрать трек"></select><button id="presenceClose" aria-label="Закрыть присутствие">×</button></div></div><div id="gantt"></div><div id="presenceCaption"></div></section><section class="timeline panel"><div class="transport"><button id="play" aria-label="Воспроизвести">▶</button><b id="clock"></b><span id="elapsed"></span><div class="transport-right"><select id="speed" aria-label="Скорость"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select><button id="start" title="В начало">|←</button><button id="end" title="В конец">→|</button></div></div><canvas id="activity" height="30"></canvas><input id="time" type="range" min="0" step="0.1" aria-label="Общее время"><div id="ticks"></div></section><div id="error" role="alert" hidden></div></main><script type="module" src="app.js"></script></body></html>
