<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc">
<title id="title">Граф соседства камер офиса</title>
<desc id="desc">План с позициями пяти камер и граф прямого соседства. Связи двусторонние: 1–2, 1–3, 2–3, 3–4, 3–5, 4–5. Пример кратчайшего пути от камеры 2 до камеры 5 проходит через камеру 3.</desc>
