<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 454" width="1200" height="454" role="img" aria-labelledby="title desc">
  <title id="title">Из локальных треков в глобальный ID</title>
  <desc id="desc">Условный пример. Вершины A, B и C представляют локальные треки с трёх камер. LogReg оценивает пары. Сначала соединяются A и B, затем по среднему весу рёбер присоединяется C. Слияние с D запрещено: в один момент люди были далеко друг от друга на плане.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#142337"/>
      <stop offset="1" stop-color="#0c131f"/>
    </linearGradient>
    <linearGradient id="output" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#143047"/>
      <stop offset="1" stop-color="#101d30"/>
    </linearGradient>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9db5d4" opacity=".14"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="m1 1 6 3.5L1 8" fill="none" stroke="#7dd3fc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="454" rx="18" fill="url(#bg)"/>
  <g font-family="system-ui, sans-serif">
    <text x="32" y="33" fill="#8fbffa" font-size="14" font-weight="700" letter-spacing="2">МЕЖКАМЕРНАЯ СШИВКА</text>
    <text x="32" y="77" fill="#eef6ff" font-size="34" font-weight="700">Из локальных треков в один ID</text>
    <text x="1168" y="33" fill="#aebfd6" font-size="15" text-anchor="end">Условный пример</text>

    <rect x="32" y="105" width="725" height="317" rx="14" fill="#101c2d" stroke="#2c425f"/>
    <rect x="33" y="106" width="723" height="315" rx="14" fill="url(#dots)"/>
    <text x="56" y="143" fill="#e1ecfa" font-size="20" font-weight="650">LogReg оценивает пары треков</text>
    <text x="56" y="168" fill="#a7bcd6" font-size="16">Внешность · время · соседство камер · геометрия</text>
    <path d="M214 236H315 M475 236H576" stroke="#78ddfb" stroke-width="3"/>
    <path d="M135 266v10q0 15 15 15h489q15 0 15-15v-10" stroke="#779abf" stroke-width="2" fill="none"/>
    <path d="M654 266v64" stroke="#ed9ca7" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
    <g fill="#e4f5ff" font-size="17" text-anchor="middle" font-weight="650">
      <text x="264" y="225">0,84</text>
      <text x="525" y="225">0,72</text>
      <rect x="367" y="278" width="57" height="24" rx="5" fill="#101c2d"/>
      <text x="395" y="296" fill="#a9c4e0">0,40</text>
    </g>
    <g fill="#1a3049" stroke="#45658a">
      <rect x="56" y="205" width="158" height="62" rx="10"/>
      <rect x="316" y="205" width="158" height="62" rx="10"/>
      <rect x="576" y="205" width="158" height="62" rx="10"/>
    </g>
    <g fill="#8be1fb">
      <circle cx="83" cy="236" r="15"/>
      <circle cx="343" cy="236" r="15"/>
      <circle cx="603" cy="236" r="15"/>
    </g>
    <g fill="#10283c" font-size="16" font-weight="750" text-anchor="middle">
      <text x="83" y="242">A</text>
      <text x="343" y="242">B</text>
      <text x="603" y="242">C</text>
    </g>
    <g fill="#edf5ff" font-size="17" font-weight="650">
      <text x="107" y="242">Камера 1</text>
      <text x="367" y="242">Камера 2</text>
      <text x="627" y="242">Камера 3</text>
    </g>
    <rect x="576" y="330" width="158" height="62" rx="10" fill="#30263a" stroke="#775265"/>
    <circle cx="603" cy="361" r="15" fill="#f4a7b3"/>
    <text x="603" y="367" fill="#392137" font-size="16" font-weight="750" text-anchor="middle">D</text>
    <text x="627" y="367" fill="#f9dde2" font-size="17" font-weight="650">Камера 4</text>
    <g text-anchor="end">
      <text x="557" y="351" fill="#f2b5c0" font-size="16" font-weight="650">Запрет слияния</text>
      <text x="557" y="375" fill="#b6c4d9" font-size="15">C и D далеко друг от друга в один момент</text>
    </g>

    <path d="M766 261h25" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="804" y="105" width="364" height="317" rx="14" fill="url(#output)" stroke="#395d7b"/>
    <text x="830" y="144" fill="#a7c7e8" font-size="15" font-weight="700" letter-spacing="1.5">ОБЪЕДИНЕНИЕ ГРУПП</text>
    <text x="830" y="186" fill="#eaf6ff" font-size="22" font-weight="650">1. Объединяем A и B</text>
    <text x="830" y="213" fill="#b5cbe3" font-size="17">Самое сильное ребро: 0,84</text>
    <text x="830" y="258" fill="#eaf6ff" font-size="22" font-weight="650">2. Присоединяем C</text>
    <text x="830" y="285" fill="#b5cbe3" font-size="17">Средний вес: (0,40 + 0,72) / 2 = 0,56</text>
    <path d="M830 310h312" stroke="#375871"/>
    <rect x="830" y="333" width="312" height="58" rx="9" fill="#1a3a51" stroke="#477f9b"/>
    <circle cx="852" cy="362" r="5" fill="#8be1fb"/>
    <text x="868" y="370" fill="#e1f7ff" font-size="22" font-weight="700">A + B + C</text>
    <text x="1122" y="369" fill="#a2ddf7" font-size="17" font-weight="650" text-anchor="end">Один ID</text>
  </g>
</svg>
